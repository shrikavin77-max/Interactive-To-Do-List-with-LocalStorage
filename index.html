<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daylist — Interactive To-Do List</title>
  <meta name="description" content="A clean, responsive to-do list application with LocalStorage persistence and dynamic filtering. Built for InternCircle Project 02.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23059669%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M9 11l3 3L22 4%22/><path d=%22M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11%22/></svg>">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="page-wrapper">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Daylist</h1>
          <p class="brand-subtitle" id="today-date">Focus on what matters today</p>
        </div>
      </div>
      <div class="status-pill" id="header-status">
        <span class="status-dot"></span>
        <span id="storage-status-text">Storage Active</span>
      </div>
    </header>

    <main class="app-card" role="main">
      <!-- Task Creation Form -->
      <form id="form" class="task-form" autocomplete="off" novalidate>
        <label for="text" class="visually-hidden">New task description</label>
        <div class="input-group">
          <input
            type="text"
            id="text"
            name="taskText"
            class="task-input"
            placeholder="Add a new task and press Enter..."
            maxlength="200"
            autocomplete="off"
            spellcheck="true"
            aria-label="New task description"
            required
          >
          <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task to list">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Add</span>
          </button>
        </div>
        <p id="form-error" class="form-error" role="alert" aria-live="polite" hidden></p>
      </form>

      <!-- Task Controls & Filters -->
      <section class="task-controls" aria-label="Task filters and summary">
        <div class="filter-group" role="tablist" aria-label="Task filters">
          <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
            All <span class="filter-count" id="count-all">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">
            Active <span class="filter-count" id="count-active">0</span>
          </button>
          <button type="button" class="filter-btn" data-filter="done" role="tab" aria-selected="false">
            Done <span class="filter-count" id="count-done">0</span>
          </button>
        </div>

        <button type="button" id="clear-completed" class="btn btn-ghost" aria-label="Clear all completed tasks">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear Done</span>
        </button>
      </section>

      <!-- Dynamic Task List -->
      <section class="task-list-container" aria-label="Tasks list">
        <ul id="list" class="task-list" aria-live="polite" aria-label="To-do items">
          <!-- Dynamically populated by app.js -->
        </ul>

        <!-- Accessible Empty State -->
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <h2 class="empty-title" id="empty-title">All caught up!</h2>
          <p class="empty-description" id="empty-description">You have no tasks in this view. Add one above to get organized.</p>
        </div>
      </section>

      <!-- App Status Footer -->
      <footer class="app-footer">
        <p id="count" class="counter-text" aria-live="polite">0 left</p>
        <span class="footer-divider" aria-hidden="true">•</span>
        <span class="persistence-hint">Auto-saved to LocalStorage</span>
      </footer>
    </main>

    <footer class="page-footer">
      <p>InternCircle Project 02 &bull; <strong>Daylist</strong></p>
    </footer>
  </div>
</body>
</html>
